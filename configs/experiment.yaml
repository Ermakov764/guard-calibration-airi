paper:
  title: "On Calibration of LLM-based Guard Models for Reliable Content Moderation"
  venue: "ICLR 2025"
  openreview: "https://openreview.net/forum?id=wUbum0nd9N"

models:
  colab_default: "ibm-granite/granite-guardian-3.1-2b"
  colab_optional: "allenai/wildguard"

dataset:
  hf_id: "allenai/wildguardmix"
  split: "wildguardtest"
  n_samples: 100
  seed: 42

perturbations:
  - clean
  - paraphrase
  - jailbreak
  - typo

metrics:
  n_bins: 15
  calibration_split: 0.3

paths:
  data_dir: data
  outputs_dir: outputs
  scores_csv: outputs/guard_scores.csv
